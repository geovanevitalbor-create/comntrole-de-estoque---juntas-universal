<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Universal Juntas — Controle de Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121212; --panel:#1c1c1c; --panel-2:#232323; --line:#303030; --line-soft:#272727;
  --verde:#00833E; --verde-escuro:#00642F; --verde-claro:#DFF2E6; --verde-profundo:#003A1C;
  --cinza-escuro:#2B2B2B; --cinza-medio:#6B6B6B; --cinza-claro:#E6E6E6; --cinza-suave:#5F5F5F; --branco:#FFFFFF;
  --sucesso:#16A34A; --aviso:#FBBF24; --erro:#DC2626; --info:#2563EB;
  --g50:#E6F4ED; --g100:#BCE5CC; --g200:#80D1A3; --g300:#4CBF7A; --g400:#26A65B;
  --g500:#00833E; --g600:#006A34; --g700:#00542A; --g800:#003D1F; --g900:#002A16;
  --txt:#EDEDED; --txt-dim:#9c9c9c; --txt-mute:#6f6f6f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--txt); font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.4;
}
button,input,select,textarea{font-family:inherit;}
button{cursor:pointer;}
a{color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#333;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- layout utils ---------- */
.flex{display:flex} .grid{display:grid} .hidden{display:none !important}
.items-center{align-items:center} .items-start{align-items:flex-start}
.justify-between{justify-content:space-between} .justify-center{justify-content:center}
.flex-col{flex-direction:column} .flex-wrap{flex-wrap:wrap} .flex-1{flex:1 1 0%} .shrink-0{flex-shrink:0}
.gap-1{gap:.25rem} .gap-1-5{gap:.375rem} .gap-2{gap:.5rem} .gap-2-5{gap:.625rem} .gap-3{gap:.75rem} .gap-4{gap:1rem} .gap-5{gap:1.25rem}
.p-1{padding:.25rem} .p-2{padding:.5rem} .p-3{padding:.75rem} .p-4{padding:1rem} .p-5{padding:1.25rem} .p-6{padding:1.5rem}
.px-2{padding-left:.5rem;padding-right:.5rem} .px-3{padding-left:.75rem;padding-right:.75rem} .px-4{padding-left:1rem;padding-right:1rem}
.py-1{padding-top:.25rem;padding-bottom:.25rem} .py-1-5{padding-top:.375rem;padding-bottom:.375rem}
.py-2{padding-top:.5rem;padding-bottom:.5rem} .py-2-5{padding-top:.625rem;padding-bottom:.625rem} .py-3{padding-top:.75rem;padding-bottom:.75rem}
.mt-1{margin-top:.25rem} .mt-2{margin-top:.5rem} .mt-3{margin-top:.75rem} .mt-4{margin-top:1rem} .mt-5{margin-top:1.25rem} .mt-6{margin-top:1.5rem}
.mb-1{margin-bottom:.25rem} .mb-2{margin-bottom:.5rem} .mb-3{margin-bottom:.75rem} .mb-4{margin-bottom:1rem} .mb-5{margin-bottom:1.25rem} .mb-6{margin-bottom:1.5rem}
.ml-2{margin-left:.5rem}
.rounded{border-radius:.4rem} .rounded-md{border-radius:.55rem} .rounded-lg{border-radius:.7rem} .rounded-xl{border-radius:.9rem} .rounded-2xl{border-radius:1.2rem} .rounded-full{border-radius:9999px}
.text-xs{font-size:.72rem} .text-sm{font-size:.8rem} .text-base{font-size:.92rem} .text-lg{font-size:1.05rem} .text-xl{font-size:1.25rem} .text-2xl{font-size:1.6rem}
.font-medium{font-weight:500} .font-semibold{font-weight:600} .font-bold{font-weight:700} .font-black{font-weight:800}
.text-white{color:#fff} .text-dim{color:var(--txt-dim)} .text-mute{color:var(--txt-mute)}
.text-verde{color:var(--verde)} .text-erro{color:var(--erro)} .text-aviso{color:var(--aviso)} .text-info{color:var(--info)} .text-sucesso{color:var(--sucesso)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-full{width:100%} .min-w-0{min-width:0}
.text-center{text-align:center} .text-right{text-align:right}
.relative{position:relative}
.opacity-40{opacity:.4}
.pointer{cursor:pointer}

/* ---------- app shell ---------- */
#app{min-height:100vh;}
.mobile-screen{min-height:100vh; background:var(--bg); max-width:520px; margin:0 auto; border-left:1px solid var(--line-soft); border-right:1px solid var(--line-soft);}
.mobile-header{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; transition:background .15s;}
.mobile-header h1{font-size:1rem; font-weight:700; margin:0; color:#fff;}
.mobile-header .eyebrow{font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin:0 0 1px; display:block;}
.mobile-header.tint-entrada{background:linear-gradient(180deg, rgba(0,131,62,.24), rgba(0,131,62,.05) 75%, var(--panel)); border-bottom-color:rgba(0,131,62,.4);}
.mobile-header.tint-saida{background:linear-gradient(180deg, rgba(220,38,38,.24), rgba(220,38,38,.05) 75%, var(--panel)); border-bottom-color:rgba(220,38,38,.4);}
.mobile-header.tint-entrada .eyebrow{color:var(--verde);}
.mobile-header.tint-saida .eyebrow{color:#ff8080;}
.header-acao-badge{width:32px; height:32px; border-radius:999px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.header-acao-badge.entrada{background:rgba(0,131,62,.24); color:var(--g300);}
.header-acao-badge.saida{background:rgba(220,38,38,.24); color:#ff8a8a;}
.icon-btn{background:none;border:none;color:var(--txt-dim);padding:4px;display:flex;align-items:center;border-radius:8px;}
.icon-btn:hover{color:#fff;background:var(--panel-2);}
.header-balanco-btn{display:flex; align-items:center; gap:.35rem; background:rgba(0,131,62,.16); border:1px solid rgba(0,131,62,.5); color:var(--verde); font-size:.72rem; font-weight:700; padding:.32rem .65rem; border-radius:999px; white-space:nowrap;}
.header-balanco-btn:hover{background:rgba(0,131,62,.28);}
.header-balanco-btn.pendente{background:rgba(220,38,38,.18); border-color:rgba(220,38,38,.55); color:#ff9d9d;}
.header-balanco-btn.pendente:hover{background:rgba(220,38,38,.3);}

.alerta-banner{display:flex; align-items:center; gap:.7rem; width:100%; text-align:left; background:rgba(220,38,38,.12); border:1px solid rgba(220,38,38,.4); color:#ffb4b4; padding:.75rem 1rem; border-radius:.8rem; font-size:.85rem;}
.alerta-banner:hover{background:rgba(220,38,38,.2);}
.alerta-banner b{color:#fff;}
.alerta-banner span{flex:1;}
.alerta-banner-arrow{transform:rotate(180deg); flex-shrink:0;}

.gestor-shell{display:flex; min-height:100vh;}
.gestor-main{flex:1; min-width:0; overflow-x:hidden;}.sidebar{width:230px; background:var(--panel); border-right:1px solid var(--line); min-height:100vh; display:flex; flex-direction:column; flex-shrink:0;}
.sidebar-brand{padding:18px 16px; border-bottom:1px solid var(--line);}
.sidebar-brand .name{font-weight:700; color:#fff; font-size:.88rem;}
.sidebar-brand .who{color:var(--txt-dim); font-size:.72rem; margin-top:2px;}
.sidebar-nav{flex:1; padding:10px; display:flex; flex-direction:column; gap:3px;}
.sidebar-link{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px; border:none; background:none; color:var(--txt-dim); font-size:.85rem; text-align:left; width:100%;}
.sidebar-link:hover{background:var(--panel-2); color:#fff;}
.sidebar-link.active{background:rgba(0,131,62,.16); color:var(--verde);}
.sidebar-foot{padding:10px; border-top:1px solid var(--line);}

.gestor-topbar{display:none;}
.dash-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:1rem;}
@media (max-width:820px){
  .sidebar{position:fixed; z-index:20; top:0; bottom:0; transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 40px rgba(0,0,0,.5);}
  .sidebar.open{transform:translateX(0);}
  .gestor-topbar{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:6;}
  .dash-grid-2{grid-template-columns:1fr;}
}

/* ---------- buttons ---------- */
.btn{border:none; border-radius:.7rem; font-weight:600; font-size:.85rem; padding:.62rem 1rem; display:inline-flex; align-items:center; justify-content:center; gap:.45rem; transition:filter .12s ease, transform .05s ease;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--verde); color:#fff;}
.btn-primary:hover{filter:brightness(1.12);}
.btn-danger{background:var(--erro); color:#fff;}
.btn-danger:hover{filter:brightness(1.12);}
.btn-ghost{background:var(--panel-2); color:var(--txt); border:1px solid var(--line);}
.btn-ghost:hover{color:#fff; border-color:#444;}
.btn-disabled,.btn:disabled{background:var(--panel-2); color:var(--txt-mute); cursor:not-allowed;}
.btn-sm{padding:.4rem .7rem; font-size:.78rem;}
.btn-block{width:100%;}

/* ---------- cards / surfaces ---------- */
.card{background:var(--panel); border:1px solid var(--line); border-radius:.9rem;}
.card-acao-entrada{border-left:3px solid var(--verde);}
.card-acao-saida{border-left:3px solid var(--erro);}
.card-dashed{background:var(--panel); border:1.5px dashed #3a3a3a; border-radius:.9rem;}
.divide-y > * + *{border-top:1px solid var(--line);}

/* ---------- inputs ---------- */
.field{margin-bottom:1rem;}
.field label{display:block; font-size:.72rem; color:var(--txt-dim); margin-bottom:.35rem;}
.input, select.input{
  width:100%; background:var(--panel-2); border:1px solid #3a3a3a; border-radius:.6rem;
  padding:.55rem .75rem; font-size:.85rem; color:#fff; outline:none;
}
.input:focus{border-color:var(--verde);}
.input-search-wrap{position:relative;}
.input-search-wrap .input{padding-left:2.2rem;}
.input-search-wrap svg{position:absolute; left:.7rem; top:50%; transform:translateY(-50%); color:var(--txt-mute);}

/* ---------- badges ---------- */
.badge{display:inline-flex; align-items:center; font-size:.68rem; font-weight:600; padding:.15rem .5rem; border-radius:999px; border:1px solid; white-space:nowrap;}
.badge-mp{background:rgba(37,99,235,.12); color:#5b9bff; border-color:rgba(37,99,235,.35);}
.badge-pa{background:rgba(0,131,62,.14); color:#3ecb84; border-color:rgba(0,131,62,.4);}
.badge-entrada{background:rgba(22,163,74,.13); color:#3fcf82; border-color:rgba(22,163,74,.35);}
.badge-saida{background:rgba(220,38,38,.13); color:#f2716b; border-color:rgba(220,38,38,.35);}
.badge-transf{background:rgba(251,191,36,.14); color:#f6c94f; border-color:rgba(251,191,36,.35);}

/* ---------- toggle switch ---------- */
.toggle{width:42px; height:24px; border-radius:999px; border:none; position:relative; background:#3a3a3a; flex-shrink:0;}
.toggle.on{background:var(--verde);}
.toggle .knob{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:999px; background:#fff; transition:transform .15s ease;}
.toggle.on .knob{transform:translateX(18px);}
.toggle-grid{display:grid; grid-template-columns:1fr 1fr; gap:.75rem;}
@media (max-width:760px){ .toggle-grid{grid-template-columns:1fr;} }

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:.82rem;}
thead th{text-align:left; color:var(--txt-dim); font-weight:600; padding:.7rem .8rem; border-bottom:1px solid var(--line); white-space:nowrap;}
tbody td{padding:.7rem .8rem; border-bottom:1px solid var(--line-soft); color:var(--txt);}
tbody tr:last-child td{border-bottom:none;}
tbody tr.row-low{background:rgba(220,38,38,.05);}
.row-clickable{cursor:pointer; transition:background .1s;}
tr.row-clickable:hover td{background:var(--panel-2);}
div.row-clickable:hover{background:var(--panel-2); border-color:#3a3a3a;}

/* ---------- KPI ---------- */
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:.9rem; padding:.9rem; display:flex; gap:.7rem; align-items:flex-start;}
.kpi .ic{padding:.5rem; border-radius:.55rem; background:rgba(0,131,62,.12); color:var(--verde); display:flex;}
.kpi .ic.warn{background:rgba(220,38,38,.12); color:#f2716b;}
.kpi .val{font-size:1.05rem; font-weight:700; color:#fff;}
.kpi .lbl{font-size:.72rem; color:var(--txt-dim);}

/* ---------- modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;}
.modal-box{background:var(--panel); border:1px solid var(--line); border-radius:1.1rem; width:100%; max-width:440px; max-height:88vh; overflow-y:auto;}
.modal-box.wide{max-width:640px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:1rem 1.2rem; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel);}
.modal-head h3{margin:0; font-size:.95rem; color:#fff; font-weight:700;}
.modal-body{padding:1.2rem;}

/* ---------- login ---------- */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background: radial-gradient(ellipse 720px 440px at 50% 6%, rgba(0,131,62,.16), transparent 65%);}
.login-card{width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:1.2rem; padding:1.9rem 2rem 2.1rem;}
.login-tabs{display:flex; margin-bottom:1.6rem; border-bottom:1px solid var(--line);}
.login-tab{flex:1; background:none; border:none; padding:.75rem 0 .85rem; font-weight:700; font-size:.78rem; letter-spacing:.03em; text-transform:uppercase; color:var(--txt-dim); border-bottom:2px solid transparent; margin-bottom:-1px; cursor:pointer;}
.login-tab.active{color:var(--verde); border-bottom-color:var(--verde);}
.btn-pill{border-radius:999px !important; text-transform:uppercase; letter-spacing:.03em; font-weight:800; color:#06210f !important; box-shadow:0 12px 32px -8px rgba(0,131,62,.6);}
.btn-pill:hover{filter:brightness(1.06);}
.login-forgot{display:block; text-align:center; margin-top:1.1rem; font-size:.78rem; color:var(--txt-dim); text-decoration:underline; cursor:pointer; background:none; border:none; width:100%;}
.login-forgot:hover{color:var(--txt);}

/* tela de seleção de acesso (quando a pessoa tem mais de um perfil liberado) */
.acesso-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; width:100%;}
.acesso-card{background:var(--panel); border:1px solid var(--line); border-radius:1rem; padding:1.6rem 1.1rem; display:flex; flex-direction:column; align-items:center; gap:.55rem; text-align:center; cursor:pointer; transition:transform .12s ease, border-color .12s ease;}
.acesso-card:hover{border-color:rgba(0,131,62,.5); transform:translateY(-2px);}
.acesso-ic{width:52px; height:52px; border-radius:.8rem; background:rgba(0,131,62,.12); color:var(--verde); display:flex; align-items:center; justify-content:center;}
.acesso-title{color:#fff; font-weight:700; font-size:.92rem;}
.acesso-desc{color:var(--txt-dim); font-size:.72rem; line-height:1.35;}

/* leitor de câmera (QR / código de barras) */
.scanner-video-wrap{position:relative; width:100%; aspect-ratio:1/1; background:#000; border-radius:.8rem; overflow:hidden;}
.scanner-video-wrap video{width:100%; height:100%; object-fit:cover; display:block;}
.scanner-frame{position:absolute; inset:14%; border:3px solid var(--verde); border-radius:.6rem; box-shadow:0 0 0 9999px rgba(0,0,0,.35); pointer-events:none;}
.perfil-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem;}
.perfil-btn{padding:.55rem 0; border-radius:.6rem; font-size:.72rem; font-weight:600; border:1px solid #3a3a3a; background:var(--panel-2); color:var(--txt-dim);}
.perfil-btn.active{background:var(--verde); border-color:var(--verde); color:#fff;}
.sidebar-badge{margin-left:auto; background:var(--erro); color:#fff; font-size:.65rem; font-weight:700; padding:.1rem .42rem; border-radius:999px; min-width:17px; text-align:center; line-height:1.3;}

/* ---------- movement / action screens ---------- */
.qty-row{display:flex; align-items:center; gap:.7rem;}
.qty-btn{width:44px; height:44px; border-radius:.6rem; background:var(--panel-2); border:1px solid #3a3a3a; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.qty-row-entrada .qty-btn{border-color:rgba(0,131,62,.5); background:rgba(0,131,62,.12);}
.qty-row-saida .qty-btn{border-color:rgba(220,38,38,.5); background:rgba(220,38,38,.1);}
.qty-row-saida .qty-input:focus{border-color:var(--erro);}
.qty-input{flex:1; text-align:center; font-size:1.1rem;}

/* ---------- etiqueta ---------- */
.etiqueta{background:#fff; color:#111; border-radius:.7rem; padding:1rem; width:100%; max-width:300px;}
.etiqueta .top{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ddd; padding-bottom:.5rem; margin-bottom:.5rem;}
.etiqueta .qr{width:96px; height:96px; margin:.7rem auto; display:grid; grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(6,1fr); gap:2px; background:#111; padding:5px; border-radius:4px;}
.etiqueta .qr span{border-radius:1px;}

/* impressão: mostra só a etiqueta, esconde barra lateral/modal/resto da página */
@media print{
  body *{visibility:hidden;}
  .etiqueta, .etiqueta *{visibility:visible;}
  .etiqueta{position:fixed; top:0; left:0; margin:0;}
}

/* ---------- dashboard / chart ---------- */
.filtro-pill{display:flex; background:var(--panel); border:1px solid var(--line); border-radius:.6rem; padding:.2rem; font-size:.75rem;}
.filtro-pill button{border:none; background:none; color:var(--txt-dim); padding:.35rem .7rem; border-radius:.45rem;}
.filtro-pill button.active{background:var(--verde); color:#fff;}
.bar-chart{display:flex; align-items:flex-end; gap:.6rem; height:180px; padding-top:10px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:2px;}
.bar-pair{display:flex; align-items:flex-end; gap:3px; height:100%;}
.bar{width:9px; border-radius:3px 3px 0 0; min-height:2px;}
.bar-day{font-size:.62rem; color:var(--txt-mute); margin-top:6px;}
.legend-dot{width:8px;height:8px;border-radius:999px;display:inline-block;}
.mapa-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(22px,1fr)); gap:6px;}
.mapa-cell{aspect-ratio:1; border-radius:4px;}

/* ---------- accordion / uso item reuse from perm-matrix ---------- */
.perm-table th, .perm-table td{text-align:center;}
.perm-table th:first-child, .perm-table td:first-child{text-align:left;}

.footnote{color:var(--txt-mute); font-size:.72rem;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-host"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

/* ============ ICON LIBRARY (inline SVG, zero external deps) ============ */
const ICON_PATHS = {

  history: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>',
  layoutDashboard: '<rect x="3" y="3" width="7.5" height="9" rx="1.4"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.4"/><rect x="13.5" y="10" width="7.5" height="11" rx="1.4"/><rect x="3" y="14" width="7.5" height="7" rx="1.4"/>',
  qrcode: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3z"/><path d="M19.2 14h1.8v1.8h-1.8z"/><path d="M14 19.2h1.8V21H14z"/><path d="M19.2 19.2H21V21h-1.8z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  minus: '<path d="M5 12h14"/>',
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',

/* ---------- tradução de erros comuns do Supabase Auth pra mensagens em pt-BR ---------- */
function traduzErroAuth(error){
  const m = (error && error.message) || '';
  if(m.includes('Invalid login credentials')) return 'E-mail ou senha incorretos.';
  if(m.includes('Email not confirmed')) return 'E-mail ainda não confirmado. Verifique sua caixa de entrada (ou peça pro admin confirmar pelo Dashboard).';
  if(m.includes('User already registered')) return 'Já existe uma conta com esse e-mail.';
  if(m.includes('Password should be at least')) return 'Senha muito curta — use pelo menos 6 caracteres.';
  if(m.includes('rate limit')) return 'Limite de envio de e-mail atingido. O serviço de e-mail padrão do Supabase permite só 2 por hora — pode levar até 1h pra liberar de novo (ou configure um SMTP próprio em Authentication > Email para remover esse limite).';
  if(m.includes('Token has expired') || m.includes('otp_expired') || m.includes('Invalid OTP') || m.includes('Invalid token')) return 'Código expirado ou incorreto. Confira os dígitos ou peça um novo.';
  return m || 'Erro inesperado. Tente novamente.';
}

  };
}

/* ---------- carregamento inicial (depois do login) ---------- */
async function carregarDadosIniciais(){
  try {
    const ehOperador = isOperadorPerfil(state.user.perfil);
    const pedidos = [
      sb.from('materials').select('*').order('nome'),
      sb.from('movements').select('*, usuario:profiles(nome)').order('data', { ascending:false }).limit(300),
      sb.from('permissions').select('*'),
      sb.from('feature_toggles').select('*'),
      sb.from('balanco_solicitacoes').select('*, solicitante:profiles(nome)').order('created_at', { ascending:false }),
    ];
    const [matRes, movRes, permRes, toggleRes, balRes] = await Promise.all(pedidos);
    if(matRes.error) throw matRes.error;
    if(movRes.error) throw movRes.error;
    if(permRes.error) throw permRes.error;
    if(toggleRes.error) throw toggleRes.error;
    if(balRes.error) throw balRes.error;

    state.materials = (matRes.data || []).map(mapMaterialFromDb);
    state.movements = (movRes.data || []).map(mapMovementFromDb);
    state.permissions = buildPermissionsFromRows(permRes.data || []);
    state.toggles = buildTogglesFromRows(toggleRes.data || []);
    state.balancoSolicitacoes = (balRes.data || []).map(mapBalancoFromDb);

    if(!ehOperador){
      const { data: perfis, error: perfisErr } = await sb.from('profiles').select('*').order('created_at');
      if(perfisErr) throw perfisErr;
      state.cadastros = (perfis || []).map(mapCadastroFromDb);
    } else {
      state.cadastros = [];
    }
    state.dadosErro = null;
  } catch(e){
    console.error('Erro ao carregar dados do Supabase:', e);
    state.dadosErro = (e && e.message) ? e.message : 'Erro desconhecido ao carregar dados.';
  }
}

async function doLoginByEmail(){
  const email = loginPrefillEmail.trim();
  const senha = (document.getElementById('login-senha') || {}).value || '';
  if(!email || !senha){
    loginStatusMsg = { type:'erro', msg:'Preencha e-mail e senha.' };
    document.getElementById('login-status').innerHTML = loginStatusHtml();
    return;
  }
  loginStatusMsg = { type:'carregando' };
  document.getElementById('login-status').innerHTML = loginStatusHtml();

  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){
    loginStatusMsg = { type:'erro', msg: traduzErroAuth(error) };
    document.getElementById('login-status').innerHTML = loginStatusHtml();
    return;
  }

  const { data: perfil, error: perfilErr } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
  if(perfilErr || !perfil){
    await sb.auth.signOut();
    loginStatusMsg = { type:'erro', msg:'Não foi possível carregar seu cadastro. Tente novamente.' };
    document.getElementById('login-status').innerHTML = loginStatusHtml();
    return;
  }
  if(perfil.status === 'pendente'){
    await sb.auth.signOut();
    loginStatusMsg = { type:'pendente', nome: perfil.nome };
    document.getElementById('login-status').innerHTML = loginStatusHtml();
    return;
  }
  if(perfil.status === 'rejeitado'){
    await sb.auth.signOut();
    loginStatusMsg = { type:'rejeitado', nome: perfil.nome };
    document.getElementById('login-status').innerHTML = loginStatusHtml();
    return;
  }
  loginStatusMsg = null;
  const acessos = perfil.acessos || [];
  if(acessos.length === 1){
    await entrarComoUsuario({ id: data.user.id, nome: perfil.nome, perfil: acessos[0], acessos });
  } else if(acessos.length > 1){
    state.loginCandidate = { id: data.user.id, nome: perfil.nome, acessos };
    render();
  } else {
    await sb.auth.signOut();
    loginStatusMsg = { type:'erro', msg:'Seu cadastro está aprovado mas sem nenhum acesso liberado ainda. Fale com o administrador.' };
    document.getElementById('login-status').innerHTML = loginStatusHtml();
  }
}
async function entrarComoUsuario(user){
  state.user = user;
  state.loginCandidate = null;
  state.screen = isOperadorPerfil(user.perfil) ? 'operador' : 'gestor';
  state.ctx = {};
  state.carregando = true;
  render();
  await carregarDadosIniciais();
  state.carregando = false;
  balancoAvisoVisto = false; // sessão nova: se tiver balanço autorizado esperando, avisa uma vez
  render();
  if(isOperadorPerfil(user.perfil)) checarAvisoBalanco();
}
let balancoAvisoVisto = false;
function checarAvisoBalanco(){
  if(balancoAvisoVisto) return;
  const autorizada = buscarSolicitacaoAutorizada(state.user.perfil);
  if(!autorizada) return;
  balancoAvisoVisto = true;
  openModal('avisoBalancoPendente', { solicitacaoId: autorizada.id });
}
function abrirRedefinirSenha(){
  rsStep = 'pedir';
  rsError = '';
  rsEmail = loginPrefillEmail.trim();
  state.mostrarRedefinirSenha = true;
  render();
}
function cancelarRedefinirSenha(){
  state.mostrarRedefinirSenha = false;
  rsStep = 'pedir';
  rsError = '';
  render();
}
async function enviarCodigoRecuperacao(){
  const emailEl = document.getElementById('rs-email');
  const email = (emailEl ? emailEl.value : rsEmail).trim();
  if(!email){ rsError = 'Digite seu e-mail.'; render(); return; }
  rsEmail = email;
  rsError = '';
  const btn = document.getElementById('btn-rs-enviar');
  if(btn){ btn.disabled = true; btn.textContent = 'Enviando...'; }
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if(error){
    rsError = traduzErroAuth(error);
    render();
    return;
  }
  rsStep = 'codigo';
  render();
}

/* ---- Tela de redefinir senha: pede e-mail, envia código, depois pede código + nova senha ----
   Usa verifyOtp (código de 6 dígitos) em vez de link — mais confiável pra um arquivo HTML solto,
   que não tem uma URL fixa pro Supabase redirecionar de volta. */
let rsStep = 'pedir';
let rsEmail = '';
let rsError = '';
function RedefinirSenhaScreen(){
  return `
  <div class="login-wrap">
    <div style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:380px;margin:0 auto">
      <div style="margin-bottom:24px">${logoLockupHtml(38)}</div>
      <div class="login-card" style="width:100%">
        ${rsStep === 'pedir' ? `
          <h2 class="text-white font-bold mb-1" style="font-size:1.05rem">Esqueci minha senha</h2>
          <p class="text-dim text-sm mb-4">Enviamos um código de verificação pro seu e-mail.</p>
          <div class="field"><label>E-mail</label><input id="rs-email" type="email" class="input" value="${esc(rsEmail)}"></div>
          ${rsError ? `<p class="text-erro text-xs mb-2">${esc(rsError)}</p>` : ''}
          <button id="btn-rs-enviar" class="btn btn-primary btn-block mt-2" onclick="enviarCodigoRecuperacao()">Enviar código</button>
          <button class="login-forgot mt-3" onclick="cancelarRedefinirSenha()">Voltar pro login</button>
        ` : `
          <h2 class="text-white font-bold mb-1" style="font-size:1.05rem">Digite o código</h2>
          <p class="text-dim text-sm mb-4">Enviamos um código pra <b>${esc(rsEmail)}</b>. Confira também a caixa de spam — pode levar um minuto.</p>
          <div class="field"><label>Código recebido</label><input id="rs-codigo" class="input" placeholder="000000" maxlength="8" style="letter-spacing:.3em;text-align:center;font-size:1.1rem"></div>
          <div class="field"><label>Nova senha</label><input id="rs-senha" type="password" class="input" placeholder="Pelo menos 6 caracteres"></div>
          <div class="field"><label>Confirmar nova senha</label><input id="rs-senha2" type="password" class="input"></div>
          ${rsError ? `<p class="text-erro text-xs mb-2">${esc(rsError)}</p>` : ''}
          <button id="btn-rs" class="btn btn-primary btn-block mt-2" onclick="confirmarNovaSenha()">Confirmar e trocar senha</button>
          <button class="login-forgot mt-3" onclick="enviarCodigoRecuperacao()">Reenviar código</button>
        `}
      </div>
    </div>
  </div>`;
}
async function confirmarNovaSenha(){
  const codigo = document.getElementById('rs-codigo').value.trim();
  const s1 = document.getElementById('rs-senha').value;
  const s2 = document.getElementById('rs-senha2').value;
  if(!codigo){ rsError = 'Digite o código recebido por e-mail.'; render(); return; }
  if(s1.length < 6){ rsError = 'Use pelo menos 6 caracteres na senha.'; render(); return; }
  if(s1 !== s2){ rsError = 'As senhas digitadas não são iguais.'; render(); return; }
  rsError = '';
  const btn = document.getElementById('btn-rs');
  if(btn){ btn.disabled = true; btn.textContent = 'Confirmando...'; }
  const { error: otpError } = await sb.auth.verifyOtp({ email: rsEmail, token: codigo, type: 'recovery' });
  if(otpError){
    rsError = 'Código inválido ou expirado: ' + traduzErroAuth(otpError);
    render();
    return;
  }
  const { error: updError } = await sb.auth.updateUser({ password: s1 });
  if(updError){
    rsError = traduzErroAuth(updError);
    render();
    return;
  }
  await sb.auth.signOut();
  state.mostrarRedefinirSenha = false;
  rsStep = 'pedir';
  loginStatusMsg = { type:'erro', msg:'Senha alterada! Entre novamente com a nova senha.' };
  render();
}

async function submitCriarConta(){
  const nome = document.getElementById('cc-nome').value.trim();
  const email = document.getElementById('cc-email').value.trim();
  const senha = document.getElementById('cc-senha').value;
  const perfilSolicitado = document.getElementById('cc-perfil').value;
  if(!nome || !email || !senha){ ccError = 'Preencha nome, e-mail e senha.'; render(); return; }
  if(senha.length < 6){ ccError = 'Senha muito curta — use pelo menos 6 caracteres.'; render(); return; }
  ccError = 'Criando conta...';
  render();
  const { error } = await sb.auth.signUp({
    email, password: senha,
    options: { data: { nome, perfil_solicitado: perfilSolicitado } },
  });
  if(error){
    ccError = traduzErroAuth(error);
    render();
    return;
  }
  await sb.auth.signOut(); // por segurança: garante que não fica logado antes da aprovação, mesmo que o Supabase autentique na hora
  ccError = '';
  loginTab = 'entrar';
  loginPrefillEmail = email;
  render();
}

function LoginScreen(){
  return `
  <div class="login-wrap">
    <div style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:380px;margin:0 auto">
      <div style="margin-bottom:24px">${logoLockupHtml(38)}</div>
      <div class="login-card" style="width:100%">
        <div class="login-tabs">
          <button class="login-tab ${loginTab==='entrar'?'active':''}" onclick="setLoginTab('entrar')">Entrar</button>
          <button class="login-tab ${loginTab==='criar'?'active':''}" onclick="setLoginTab('criar')">Criar conta</button>
        </div>
        ${loginTab === 'entrar' ? `
          <div class="field">
            <label>E-mail</label>
            <input id="login-email" type="email" class="input" placeholder="seu@universaljuntas.com.br" value="${esc(loginPrefillEmail)}" oninput="trackLoginEmail(this.value)">
          </div>
          <div class="field">
            <label>Senha</label>
            <input id="login-senha" type="password" class="input" placeholder="Sua senha">
          </div>
          <div id="login-status">${loginStatusHtml()}</div>
          <button class="btn btn-primary btn-pill btn-block mt-2" onclick="doLoginByEmail()">Entrar</button>
          <button class="login-forgot" onclick="abrirRedefinirSenha()">Esqueci minha senha</button>
        ` : `
          <div class="field"><label>Nome completo</label><input id="cc-nome" class="input" placeholder="Seu nome"></div>
          <div class="field"><label>E-mail corporativo</label><input id="cc-email" type="email" class="input" placeholder="seu@universaljuntas.com.br"></div>
          <div class="field"><label>Senha</label><input id="cc-senha" type="password" class="input" placeholder="Crie uma senha"></div>
          <div class="field">
            <label>Função que você exerce</label>
            <select id="cc-perfil" class="input">
              ${PROFILES.map(p => `<option value="${p.key}">${esc(p.fullLabel)}</option>`).join('')}
            </select>
          </div>
          ${ccError ? `<p class="text-erro text-xs mb-3">${esc(ccError)}</p>` : ''}
          <button class="btn btn-primary btn-pill btn-block mt-2" onclick="submitCriarConta()">Criar conta</button>
          <p class="footnote text-center mt-3">Sua conta fica pendente até um administrador aprovar o acesso.</p>
        `}
      </div>
      <p class="footnote text-center mt-4">Universal Juntas — Sistema de Controle de Estoque.</p>
    </div>
  </div>`;
}

function SelecionarAcessoScreen(){
  const c = state.loginCandidate;
  const opts = PROFILES.filter(p => c.acessos.includes(p.key));
  return `
  <div class="login-wrap">
    <div style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:640px;margin:0 auto;text-align:center">

/* ============ LEITOR DE CÂMERA (QR Code + código de barras EAN) ============
   Estratégia: BarcodeDetector nativo do navegador é o caminho principal — não depende de
   nenhum script externo e lê tanto QR quanto EAN/UPC. Existe hoje em Chrome/Edge/Android.
   Em navegadores sem essa API (principalmente Safari/iOS), cai pra uma biblioteca carregada
   sob demanda (qr-scanner, via cdnjs) que só lê QR Code — código de barras EAN fica
   indisponível nesse caso, e a tela avisa isso claramente. */
let scannerStream = null;
let scannerActive = false;
let scannerStatus = '';
let qrScannerFallbackInstance = null;
let scanNaoEncontrado = '';
let scanSemPermissao = '';

function abrirScanner(){
  scannerStatus = '';
  openModal('scanner');
  iniciarCamera();
}
function atualizarStatusScanner(){ const el = document.getElementById('scanner-status'); if(el) el.textContent = scannerStatus; }
function pararScanner(){
  scannerActive = false;
  if(scannerStream){ scannerStream.getTracks().forEach(t => t.stop()); scannerStream = null; }
  if(qrScannerFallbackInstance){ try{ qrScannerFallbackInstance.stop(); qrScannerFallbackInstance.destroy(); }catch(e){} qrScannerFallbackInstance = null; }
}
async function iniciarCamera(){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    scannerStatus = 'Este navegador não permite acesso à câmera (ou a página não está em HTTPS, que é obrigatório). Use a busca manual abaixo.';
    atualizarStatusScanner();
    return;
  }
  if('BarcodeDetector' in window){
    try {
      const suportados = await BarcodeDetector.getSupportedFormats();
      const formatos = ['qr_code','ean_13','ean_8','upc_a','upc_e','code_128'].filter(f => suportados.includes(f));
      const detector = new BarcodeDetector({ formats: formatos.length ? formatos : ['qr_code'] });
      await iniciarVideoENativo(detector);
      return;
    } catch(e){ /* segue pro fallback abaixo */ }
  }
  await iniciarVideoEFallback();
}
async function iniciarVideoENativo(detector){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    scannerStream = stream;
    const video = document.getElementById('scanner-video');
    if(!video){ pararScanner(); return; }
    video.srcObject = stream;
    await video.play();
    scannerActive = true;
    scannerStatus = 'Aponte a câmera para o código de barras ou QR Code...';
    atualizarStatusScanner();
    loopNativo(video, detector);
  } catch(e){
    scannerStatus = 'Não foi possível acessar a câmera. Verifique a permissão do navegador.';
    atualizarStatusScanner();
  }
}
async function loopNativo(video, detector){
  if(!scannerActive) return;
  try {
    const codes = await detector.detect(video);
    if(codes && codes.length){ onCodigoDetectado(codes[0].rawValue); return; }
  } catch(e){ /* ignora erro de frame isolado e tenta o próximo */ }
  requestAnimationFrame(() => loopNativo(video, detector));
}
let qrFallbackLibPromise = null;
function carregarQrFallbackLib(){
  if(window.QrScanner) return Promise.resolve();
  if(qrFallbackLibPromise) return qrFallbackLibPromise;
  qrFallbackLibPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner.umd.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('falha ao carregar biblioteca de QR'));
    document.head.appendChild(s);
  });
  return qrFallbackLibPromise;
}
async function iniciarVideoEFallback(){
  scannerStatus = 'Carregando leitor de QR Code...';
  atualizarStatusScanner();
  try { await carregarQrFallbackLib(); }
  catch(e){
    scannerStatus = 'Este navegador não tem suporte a leitura por câmera. Use a busca manual abaixo.';
    atualizarStatusScanner();
    return;
  }
  try {
    const video = document.getElementById('scanner-video');
    if(!video) return;
    window.QrScanner.WORKER_PATH = 'https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner-worker.min.js';
    qrScannerFallbackInstance = new window.QrScanner(video, (resultado) => {
      const valor = (resultado && resultado.data) ? resultado.data : resultado;
      if(valor) onCodigoDetectado(valor);
    }, { highlightScanRegion:false, highlightCodeOutline:false, returnDetailedScanResult:true });
    await qrScannerFallbackInstance.start();
    scannerActive = true;
    scannerStatus = 'Aponte a câmera para o QR Code (código de barras EAN não é suportado neste navegador — use a busca manual).';
    atualizarStatusScanner();
  } catch(e){
    scannerStatus = 'Não foi possível acessar a câmera. Verifique a permissão do navegador.';
    atualizarStatusScanner();
  }
}
function onCodigoDetectado(valor){
  pararScanner();
  const codigo = String(valor).trim();
  const match = state.materials.find(m => m.id.toLowerCase()===codigo.toLowerCase() || (m.codigoBarras && m.codigoBarras===codigo));
  modal = null;
  scanNaoEncontrado = '';
  scanSemPermissao = '';
  if(!match){ scanNaoEncontrado = codigo; render(); return; }
  const acao = state.ctx.acao;
  const permKey = match.tipo === 'materia_prima' ? `${acao}_mp` : `${acao}_pa`;
  const perms = state.permissions[state.user.perfil];
  if(!perms[permKey]){ scanSemPermissao = match.nome; render(); return; }
  navTo('movimentar', { acao, materialId: match.id });
}

/* Arquitetura: o input de quantidade (#mov-qtd) NUNCA é recriado via innerHTML depois do
   primeiro render da tela — só os blocos dependentes (saldo, consumos, botão) são

function recalcConsumos(mat, qtd){
  if(mat.tipo === 'produto_acabado' && mat.composicao && state.toggles.integracao_producao){
    currentConsumos = mat.composicao.map(c => ({ materialId:c.materialId, quantidade: Math.round(c.qtdPorUnidade*qtd*1000)/1000 }));
  } else { currentConsumos = []; }
}

  const saldoDepois = acao === 'entrada' ? mat.saldo + qtd : mat.saldo - qtd;

  return `

      ${insuficiente ? `<p class="text-erro text-xs mt-2">Saldo insuficiente para essa saída.</p>` : ''}

  return `
    <div class="card p-4 mb-4">

    </div>`;

function confirmBtnHtml(mat, acao, qtd){
  const saldoDepois = acao === 'entrada' ? mat.saldo + qtd : mat.saldo - qtd;
  const insuficiente = acao === 'saida' && saldoDepois < 0;
  const disabled = insuficiente || qtd <= 0;

function onQtyChange(){
  const mat = getMat(state.ctx.materialId);
  const acao = state.ctx.acao;
  const qtd = Math.max(0, Number(document.getElementById('mov-qtd').value)||0);
  state.ctx._qtd = qtd;

function stepQtd(delta){
  const input = document.getElementById('mov-qtd');
  const nv = Math.max(1, Number(input.value||1) + delta);
  input.value = nv;
  onQtyChange();

function updateConsumo(i, v){ currentConsumos[i].quantidade = Number(v)||0; }
async function confirmMovimentar(){
  const acao = state.ctx.acao;
  const mat = getMat(state.ctx.materialId);
  const qtd = Number(document.getElementById('mov-qtd').value || 0);
  const saldoDepois = acao === 'entrada' ? mat.saldo + qtd : mat.saldo - qtd;
  if((acao === 'saida' && saldoDepois < 0) || qtd <= 0) return;
  const consumos = (acao === 'entrada' && mat.tipo === 'produto_acabado') ? currentConsumos : [];
  movSubmitError = '';
  const btn = document.getElementById('btn-confirmar-mov');
  if(btn){ btn.disabled = true; btn.textContent = 'Registrando...'; }
  try {
    await applyMovement({ materialId:mat.id, acao, qtd, consumos });
  } catch(e){
    movSubmitError = 'Não foi possível registrar: ' + ((e && e.message) || e);
    const host = document.getElementById('confirmar-host');
    if(host) host.innerHTML = confirmBtnHtml(mat, acao, qtd);

  // Etiqueta só faz sentido pra entrada de matéria-prima (lote novo chegando, precisa de identificação física).
  // Produto acabado já tem QR/EAN fixo na prateleira — escaneia o que já existe, não imprime de novo.

  if(acao === 'entrada' && mat.tipo === 'materia_prima' && state.toggles.impressao_etiquetas){
    navTo('etiqueta', { materialId: mat.id });

/* ============ APLICAR MOVIMENTAÇÃO (lógica de negócio) ============ */
async function applyMovement({ materialId, acao, qtd, consumos, tipoOverride, motivo, deltaOverride }){
  const target = getMat(materialId);
  const tipoKey = tipoOverride || (target.tipo === 'materia_prima' ? `${acao}_mp` : `${acao}_pa`);
  const { data, error } = await sb.rpc('registrar_movimento', {
    p_material_id: materialId, p_tipo: tipoKey, p_quantidade: qtd,
    p_motivo: motivo || (acao === 'entrada' ? 'Compra' : 'Produção'),
    p_delta_override: (deltaOverride !== undefined) ? deltaOverride : null,
  });
  if(error) throw error;
  target.saldo = Number(data.saldo_posterior);
  state.movements.unshift({
    id: data.id, data: new Date(data.data), tipo: data.tipo, materialId: data.material_id,
    quantidade: Number(data.quantidade), saldoAnterior: Number(data.saldo_anterior), saldoPosterior: Number(data.saldo_posterior),
    usuario: state.user.nome, motivo: data.motivo,
  });
  if(consumos && consumos.length){
    for(const c of consumos){
      if(!c.materialId || c.quantidade <= 0) continue;
      const { data: d2, error: e2 } = await sb.rpc('registrar_movimento', {
        p_material_id: c.materialId, p_tipo: 'saida_mp', p_quantidade: c.quantidade,
        p_motivo: `Consumo p/ produção de ${target.nome}`, p_delta_override: null,
      });
      if(e2) throw e2;
      const cm = getMat(c.materialId);
      if(cm) cm.saldo = Number(d2.saldo_posterior);
      state.movements.unshift({
        id: d2.id, data: new Date(d2.data), tipo: d2.tipo, materialId: d2.material_id,
        quantidade: Number(d2.quantidade), saldoAnterior: Number(d2.saldo_anterior), saldoPosterior: Number(d2.saldo_posterior),
        usuario: state.user.nome, motivo: d2.motivo,
      });
    }
  }
}

function calcularCurvaABC(mats){
  const comValor = mats.map(m => ({ m, valor: m.saldo*m.valorUnitario })).filter(x => x.valor > 0);
  comValor.sort((a,b) => b.valor - a.valor);
  const total = comValor.reduce((s,x) => s+x.valor, 0) || 1;
  let acumulado = 0;
  return comValor.map(x => {
    acumulado += x.valor;
    const pctAcumulado = acumulado/total*100;
    const classe = pctAcumulado <= 80 ? 'A' : pctAcumulado <= 95 ? 'B' : 'C';
    return { ...x, pct: x.valor/total*100, pctAcumulado, classe };
  });
}
function curvaAbcHtml(mats){
  const linhas = calcularCurvaABC(mats);
  const CLASS_COLOR = { A:'badge-entrada', B:'badge-transf', C:'badge-saida' };
  const resumo = ['A','B','C'].map(c => ({ classe:c, n: linhas.filter(l=>l.classe===c).length }));
  return `
    <div class="card p-4 mt-4">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h3 class="text-sm font-medium text-white">Curva ABC (por valor em estoque)</h3>
        <div class="flex gap-2 text-xs text-dim">
          ${resumo.map(r => `<span class="badge ${CLASS_COLOR[r.classe]}">${r.classe}: ${r.n}</span>`).join('')}
        </div>
      </div>
      ${linhas.length===0 ? `<p class="text-dim text-sm">Sem dados suficientes pra calcular.</p>` : `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Material</th><th class="text-right">Quantidade</th><th class="text-right">Valor em estoque</th><th class="text-right">% do total</th><th class="text-right">% acumulado</th><th class="text-right">Classe</th></tr></thead>
            <tbody>
              ${linhas.map(l => `
                <tr class="row-clickable" onclick="abrirDetalhesMaterial('${l.m.id}')">
                  <td class="text-white">${esc(l.m.nome)}</td>
                  <td class="text-right text-dim">${fmtNum(l.m.saldo)} ${esc(l.m.unidade)}</td>
                  <td class="text-right text-dim">${fmtMoney(l.valor)}</td>
                  <td class="text-right text-dim">${l.pct.toFixed(1)}%</td>
                  <td class="text-right text-dim">${l.pctAcumulado.toFixed(1)}%</td>
                  <td class="text-right"><span class="badge ${CLASS_COLOR[l.classe]}">${l.classe}</span></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      `}
      <p class="footnote mt-2">Classe A = itens que somam até 80% do valor total em estoque · B = até 95% · C = restante.</p>
    </div>`;
}
function calcularPrevisaoConsumo(mats, janelaDias){
  const limite = new Date(); limite.setDate(limite.getDate()-janelaDias); limite.setHours(0,0,0,0);
  return mats.map(m => {
    const saidas = state.movements.filter(mv => mv.materialId===m.id && movType(mv.tipo).direction<0 && mv.data >= limite);
    const totalSaida = saidas.reduce((s,mv)=>s+mv.quantidade,0);
    const taxaDiaria = totalSaida/janelaDias;
    const diasRestantes = taxaDiaria>0 ? m.saldo/taxaDiaria : null;
    return { m, taxaDiaria, diasRestantes };
  }).filter(x => x.taxaDiaria > 0).sort((a,b) => (a.diasRestantes??Infinity) - (b.diasRestantes??Infinity));
}
function previsoesConsumoHtml(mats){
  const janela = 30;
  const linhas = calcularPrevisaoConsumo(mats, janela);
  return `
    <div class="card p-4 mt-4">
      <h3 class="text-sm font-medium text-white mb-1">Previsão de consumo</h3>
      <p class="text-dim text-xs mb-3">Com base na média de saída dos últimos ${janela} dias.</p>

}

async function saveMaterialForm(){
  const tipo = document.getElementById('mf-tipo').value;
  const id = document.getElementById('mf-id').value;
  const lote = document.getElementById('mf-lote').value.trim();
  if(state.toggles.controle_lote && tipo === 'materia_prima' && !lote){
    mfError = 'Controle por Lote está ativo em Configurações — o campo Lote é obrigatório para matéria-prima.';
    render();
    return;
  }
  const validadeEl = document.getElementById('mf-validade');
  const f = {
    tipo,
    nome: document.getElementById('mf-nome').value,
    categoria: document.getElementById('mf-categoria').value,
    unidade: document.getElementById('mf-unidade').value,
    fornecedor: document.getElementById('mf-fornecedor').value,
    lote,
    validade: validadeEl ? validadeEl.value : (state.materials.find(m=>m.id===id)?.validade || ''),
    especificacao: document.getElementById('mf-especificacao').value,
    cliente: document.getElementById('mf-cliente').value,
    saldo: Number(document.getElementById('mf-saldo').value)||0,
    valorUnitario: Number(document.getElementById('mf-valor').value)||0,
    estoqueMinimo: Number(document.getElementById('mf-minimo').value)||0,
    setor: document.getElementById('mf-setor').value.trim(),
    rua: document.getElementById('mf-rua').value.trim(),
    bloco: document.getElementById('mf-bloco').value.trim(),
    codigoBarras: document.getElementById('mf-codigobarras').value.trim(),
  };
  mfError = '';
  const dbRow = {
    nome: f.nome, tipo: f.tipo, categoria: f.categoria || null, unidade: f.unidade,
    fornecedor: f.fornecedor || null, lote: f.lote || null, validade: f.validade || null,
    especificacao: f.especificacao || null, cliente: f.cliente || null,
    valor_unitario: f.valorUnitario, estoque_minimo: f.estoqueMinimo, saldo: f.saldo,
    setor: f.setor || null, rua: f.rua || null, bloco: f.bloco || null,
    codigo_barras: f.codigoBarras || null,
  };
  const btn = document.getElementById('btn-salvar-material');
  if(btn){ btn.disabled = true; btn.textContent = 'Salvando...'; }
  try {
    if(id){
      const { error } = await sb.from('materials').update(dbRow).eq('id', id);
      if(error) throw error;
      const idx = state.materials.findIndex(m=>m.id===id);
      state.materials[idx] = { ...state.materials[idx], ...f, id };
    } else {
      const prefix = tipo==='materia_prima' ? 'MAT' : 'PA';
      f.id = prefix + '-' + Math.floor(100000+Math.random()*900000);
      const { error } = await sb.from('materials').insert({ id: f.id, ...dbRow });
      if(error) throw error;
      state.materials.push(f);
    }
  } catch(e){
    mfError = 'Não foi possível salvar: ' + ((e && e.message) || e);
    const body = document.querySelector('.modal-body');
    if(body) body.innerHTML = materialFormHtml(id ? getMat(id) : null);
    return;
  }
  mfError = '';
  closeModal();
}

function diasParaVencer(validade){
  if(!validade) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const venc = new Date(validade+'T00:00:00');
  return Math.round((venc-hoje)/(1000*60*60*24));
}
function AlertasScreen(){
  if(!state.toggles.alertas_estoque){
    return `<div class="p-6"><h1 class="text-xl font-bold text-white mb-2">Alertas de Estoque</h1><p class="text-dim text-sm">Alertas desativados pelo administrador em Configurações.</p></div>`;
  }
  const criticos = state.materials.filter(m => m.saldo < m.estoqueMinimo*0.5);
  const atencao = state.materials.filter(m => m.saldo >= m.estoqueMinimo*0.5 && m.saldo < m.estoqueMinimo);
  const items = [...criticos.map(m=>({m,nivel:'crítico'})), ...atencao.map(m=>({m,nivel:'atenção'}))];
  let validadeHtml = '';
  if(state.toggles.controle_validade){
    const comValidade = state.materials.filter(m => m.validade);
    const vencidos = comValidade.filter(m => diasParaVencer(m.validade) < 0);
    const vencendo = comValidade.filter(m => { const d = diasParaVencer(m.validade); return d >= 0 && d <= 30; });
    if(vencidos.length || vencendo.length){
      validadeHtml = `
        <h3 class="text-sm font-semibold text-white mt-6 mb-2">Validade</h3>
        <div style="display:flex;flex-direction:column;gap:.5rem">
          ${[...vencidos.map(m=>({m,tipo:'vencido'})), ...vencendo.map(m=>({m,tipo:'vencendo'}))].map(({m,tipo}) => `

              <div class="flex items-center gap-3">
                <span class="${tipo==='vencido'?'text-erro':'text-aviso'}">${icon('alertTriangle',16)}</span>
                <div>
                  <div class="text-white text-sm">${esc(m.nome)}</div>
                  <div class="text-dim text-xs">Lote ${esc(m.lote||'—')} · ${tipo==='vencido' ? `vencido há ${Math.abs(diasParaVencer(m.validade))} dia(s)` : `vence em ${diasParaVencer(m.validade)} dia(s)`}</div>
                </div>
              </div>
              <span class="badge ${tipo==='vencido'?'badge-saida':'badge-transf'}">${tipo==='vencido'?'vencido':'vencendo'}</span>
            </div>`).join('')}
        </div>`;
    }
  }
  return `
    <div class="p-6">
      <h1 class="text-xl font-bold text-white mb-4">Alertas de Estoque</h1>
      <div class="grid mb-6" style="grid-template-columns:1fr 1fr;gap:.75rem;max-width:420px">
        ${kpi('alertTriangle','Estoque crítico', criticos.length, criticos.length>0)}
        ${kpi('bell','Estoque em atenção', atencao.length, false)}
      </div>
      <div style="display:flex;flex-direction:column;gap:.5rem">
        ${items.map(({m,nivel}) => `
          <div class="card p-3 flex items-center justify-between row-clickable" onclick="abrirDetalhesMaterial('${m.id}')">
            <div class="flex items-center gap-3">
              <span class="${nivel==='crítico'?'text-erro':'text-aviso'}">${icon('alertTriangle',16)}</span>
              <div>
                <div class="text-white text-sm">${esc(m.nome)}</div>
                <div class="text-dim text-xs">${TIPO_LABEL[m.tipo]} · saldo ${fmtNum(m.saldo)} ${m.unidade} (mínimo ${m.estoqueMinimo})</div>
              </div>
            </div>
            <span class="badge ${nivel==='crítico'?'badge-saida':'badge-transf'}">${nivel}</span>
          </div>`).join('')}
        ${items.length===0 ? `<p class="text-dim text-sm">Nenhum alerta de estoque baixo no momento.</p>` : ''}
      </div>
      ${validadeHtml}
    </div>`;
}

}
function escopoResumoTexto(escopo){
  const partes = [escopo.tipo==='total' ? 'Matéria-prima e produto acabado' : (escopo.tipo==='materia_prima' ? 'Matéria-prima' : 'Produto acabado')];
  if(escopo.setor) partes.push('Setor ' + escopo.setor);
  if(escopo.rua) partes.push('Rua ' + escopo.rua);
  if(escopo.bloco) partes.push('Bloco ' + escopo.bloco);
  return partes.join(' · ');
}

function InventarioScreen(){
  if(isOperadorPerfil(state.user.perfil)){
    if(inventarioSession) return inventarioSession.etapa === 'revisao' ? inventarioRevisaoHtml() : inventarioContagemHtml();
    const autorizada = buscarSolicitacaoAutorizada(state.user.perfil);
    if(autorizada) return balancoAutorizadoIniciarHtml(autorizada);
    const pendente = buscarSolicitacaoPendente(state.user.perfil);
    if(pendente) return balancoPendenteHtml(pendente);
    return balancoSolicitarHtml();
  }
  if(!inventarioSession) return inventarioEscopoHtml();
  if(inventarioSession.etapa === 'revisao') return inventarioRevisaoHtml();
  return inventarioContagemHtml();
}

/* ---- Fluxo de autorização (operador precisa que gestor/admin já tenha pedido, ou pedir ele mesmo) ---- */
function tipoParaPerfil(perfil){
  if(perfil === 'operador_mp') return 'materia_prima';
  if(perfil === 'operador_pa') return 'produto_acabado';
  return 'total';
}
function buscarSolicitacaoAutorizada(perfil){
  const lista = state.balancoSolicitacoes.filter(s => s.perfilAlvo === perfil && s.status === 'autorizado');
  return lista.length ? lista[lista.length-1] : null;
}
function buscarSolicitacaoPendente(perfil){
  const lista = state.balancoSolicitacoes.filter(s => s.perfilAlvo === perfil && s.status === 'pendente');
  return lista.length ? lista[lista.length-1] : null;
}

  const s = inventarioSession;
  const divergentes = s.itens.filter(it => it.contado !== '' && Math.round((Number(it.contado)-getMat(it.materialId).saldo)*100)/100 !== 0);

        <div class="table-wrap card mb-4">
          <table>
            <thead><tr><th>Material</th><th class="text-right">Sistema</th><th class="text-right">Contado</th><th class="text-right">Diferença</th></tr></thead>
            <tbody>
              ${divergentes.map(it => { const m = getMat(it.materialId); const diff = Math.round((Number(it.contado)-m.saldo)*100)/100; return `
                <tr>
                  <td class="text-white">${esc(m.nome)}</td>
                  <td class="text-right text-dim">${fmtNum(m.saldo)} ${m.unidade}</td>
                  <td class="text-right" style="color:var(--txt)">${fmtNum(Number(it.contado))} ${m.unidade}</td>
                  <td class="text-right font-semibold ${diff<0?'text-erro':'text-sucesso'}">${diff>0?'+':''}${fmtNum(diff)} ${m.unidade}</td>
                </tr>`; }).join('')}
            </tbody>
          </table>
        </div>
      `}
      <div class="flex items-center gap-2 flex-wrap">
        <button class="btn btn-ghost" onclick="inventarioSession.etapa='contagem'; render()">Voltar pra contagem</button>
        ${divergentes.length>0 ? `
          <button class="btn btn-primary" id="btn-aplicar-balanco" onclick="aplicarInventario()">Finalizar balanço (${divergentes.length} ajuste${divergentes.length===1?'':'s'})</button>
          <button class="btn btn-ghost" onclick="cancelarInventario()">Cancelar sem aplicar</button>
        ` : `<button class="btn btn-primary" id="btn-aplicar-balanco" onclick="aplicarInventario()">Finalizar balanço (sem diferenças)</button>`}
      </div>
      ${balancoAplicarError ? `<p class="text-erro text-xs mt-2">${esc(balancoAplicarError)}</p>` : ''}
    </div>`;
}
let balancoAplicarError = '';
async function aplicarInventario(){
  const s = inventarioSession;
  const resumo = escopoResumoTexto(s.escopo);
  balancoAplicarError = '';
  const btn = document.getElementById('btn-aplicar-balanco');
  if(btn){ btn.disabled = true; btn.textContent = 'Aplicando...'; }
  try {
    for(const it of s.itens){
      if(it.contado === '') continue;
      const m = getMat(it.materialId);
      const diff = Math.round((Number(it.contado) - m.saldo) * 100) / 100;
      if(diff === 0) continue;
      await applyMovement({ materialId: it.materialId, qtd: Math.abs(diff), tipoOverride:'ajuste', motivo:`Balanço de estoque (${resumo})`, deltaOverride: diff });
    }
    if(s.solicitacaoId){
      const { error } = await sb.from('balanco_solicitacoes').update({ status:'concluido' }).eq('id', s.solicitacaoId);
      if(error) throw error;
      const sol = state.balancoSolicitacoes.find(x=>x.id===s.solicitacaoId);
      if(sol) sol.status = 'concluido';
    }
  } catch(e){
    balancoAplicarError = 'Não foi possível concluir o balanço: ' + ((e && e.message) || e) + ' (alguns ajustes podem já ter sido aplicados — confira o Histórico antes de tentar de novo)';
    render();
    return;
  }
  inventarioSession = null;
  window.inventarioSession = null;
  render();
}

}

  const pendCount = state.cadastros.filter(c => c.status === 'pendente').length;
  return `
    <div class="p-6">
      <h1 class="text-xl font-bold text-white mb-4">Configurações</h1>
      <div class="flex gap-1 mb-5" style="background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.25rem;width:fit-content;font-size:.8rem">
        <button onclick="setConfigTab('geral')" style="border:none;background:${configTab==='geral'?'var(--verde)':'transparent'};color:${configTab==='geral'?'#fff':'var(--txt-dim)'};border-radius:.45rem;padding:.4rem .9rem;font-weight:600">Visão geral</button>
        <button onclick="setConfigTab('perfil')" style="border:none;background:${configTab==='perfil'?'var(--verde)':'transparent'};color:${configTab==='perfil'?'#fff':'var(--txt-dim)'};border-radius:.45rem;padding:.4rem .9rem;font-weight:600">Por perfil de acesso</button>
        <button onclick="setConfigTab('aprovacoes')" style="border:none;background:${configTab==='aprovacoes'?'var(--verde)':'transparent'};color:${configTab==='aprovacoes'?'#fff':'var(--txt-dim)'};border-radius:.45rem;padding:.4rem .9rem;font-weight:600">Usuários e Aprovações ${pendCount>0?`<span class="sidebar-badge" style="margin-left:.4rem">${pendCount}</span>`:''}</button>
      </div>
      ${configTab==='geral' ? `
        <p class="text-white font-semibold mb-1">Ativar ou desativar funcionalidades do sistema</p>
        <p class="text-dim text-xs mb-4">Gerencie quais recursos estarão disponíveis para os usuários do sistema.</p>
        <div class="toggle-grid" style="max-width:900px">
          ${TOGGLE_META.map(t => `
            <div class="card flex items-center justify-between p-4">
              <div class="flex items-start gap-3" style="padding-right:1rem">
                <span class="text-verde" style="margin-top:.15rem">${icon(t.icon,18)}</span>
                <div>
                  <div class="text-white text-sm font-medium">${esc(t.label)}</div>
                  <div class="text-dim text-xs mt-1">${esc(t.desc)}</div>
                </div>
              </div>
              <button class="toggle ${state.toggles[t.key]?'on':''}" onclick="toggleFeature('${t.key}')"><span class="knob"></span></button>
            </div>`).join('')}
        </div>
      ` : configTab==='perfil' ? `
        <div class="card p-4 table-wrap" style="max-width:760px">
          <p class="text-dim text-xs mb-3 flex items-center gap-1-5">${icon('sliders',13)} Define quais movimentações cada perfil de usuário pode executar no app do operador.</p>
          <table class="perm-table">
            <thead><tr><th>Movimentação</th>${PROFILES.map(p=>`<th>${p.label}</th>`).join('')}</tr></thead>
            <tbody>
              ${MOVEMENT_TYPES.map(mt => `
                <tr>
                  <td class="text-dim">${esc(mt.label)}</td>
                  ${PROFILES.map(p => `<td><input type="checkbox" ${state.permissions[p.key][mt.key]?'checked':''} onchange="togglePermission('${p.key}','${mt.key}')" style="width:16px;height:16px;accent-color:var(--verde)"></td>`).join('')}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      ` : aprovacoesTabHtml()}
    </div>`;
}

/* ---- Aba: Usuários e Aprovações ---- */
function statusBadge(status){
  if(status==='aprovado') return `<span class="badge badge-entrada">aprovado</span>`;
  if(status==='pendente') return `<span class="badge badge-transf">pendente</span>`;
  return `<span class="badge badge-saida">recusado</span>`;
}
let cadastroActionError = '';
function aprovacoesTabHtml(){
  const pendentes = state.cadastros.filter(c => c.status === 'pendente');
  return `
    <div style="max-width:860px">
      ${cadastroActionError ? `<p class="text-erro text-xs mb-3">${esc(cadastroActionError)}</p>` : ''}
      <h3 class="text-sm font-semibold text-white mb-2">Pendentes de aprovação (${pendentes.length})</h3>
      ${pendentes.length === 0 ? `<p class="text-dim text-sm mb-6">Nenhum cadastro aguardando aprovação.</p>` : `
        <div style="display:flex;flex-direction:column;gap:.6rem" class="mb-6">
          ${pendentes.map(c => `
            <div class="card p-3">
              <div class="text-white text-sm font-medium">${esc(c.nome)}</div>
              <div class="text-dim text-xs mt-0.5 mb-2">${esc(c.email)} · solicitou <b>${esc(PROFILES.find(p=>p.key===c.perfilSolicitado)?.fullLabel||c.perfilSolicitado)}</b> · ${c.dataCadastro.toLocaleDateString('pt-BR')}</div>
              <p class="text-mute text-xs mb-1-5">Conceder acesso(s) — pode marcar mais de um:</p>
              <div class="flex items-center gap-3 flex-wrap mb-2">
                ${PROFILES.map(p => `
                  <label class="flex items-center gap-1-5 text-xs" style="color:var(--txt-dim)">
                    <input type="checkbox" id="aprova-${c.id}-${p.key}" ${p.key===c.perfilSolicitado?'checked':''} style="width:14px;height:14px;accent-color:var(--verde)">
                    ${esc(p.label)}
                  </label>`).join('')}
              </div>
              <div class="flex items-center gap-2">
                <button class="btn btn-primary btn-sm" id="btn-aprova-${c.id}" onclick="aprovarCadastro('${c.id}')">${icon('shieldCheck',14)} Aprovar acesso(s) marcado(s)</button>
                <button class="btn btn-danger btn-sm" onclick="rejeitarCadastro('${c.id}')">Recusar</button>
              </div>
            </div>`).join('')}
        </div>
      `}
      <h3 class="text-sm font-semibold text-white mb-2">Todos os usuários</h3>
      <p class="text-dim text-xs mb-2">Editar nome, acessos ou status de qualquer usuário. Trocar e-mail ou senha de outra pessoa exige a Admin API do Supabase (chave de servidor) — não é feito por aqui.</p>
      <div class="table-wrap card">
        <table>
          <thead><tr><th>Nome</th><th>E-mail</th><th>Acesso(s)</th><th>Status</th><th>Data</th><th class="text-right">Ações</th></tr></thead>
          <tbody>
            ${state.cadastros.map(c => `
              <tr>
                <td class="text-white">${esc(c.nome)}</td>
                <td class="text-dim">${esc(c.email)}</td>
                <td class="text-dim">${(c.acessos && c.acessos.length) ? c.acessos.map(a=>esc(PROFILES.find(p=>p.key===a)?.label||a)).join(', ') : '—'}</td>
                <td>${statusBadge(c.status)}</td>
                <td class="text-dim">${c.dataCadastro.toLocaleDateString('pt-BR')}</td>
                <td class="text-right"><button class="icon-btn" onclick="euError='';openModal('editarUsuario',{cadastroId:'${c.id}'})">${icon('edit',15)}</button></td>
              </tr>`).join('')}
            ${state.cadastros.length===0 ? `<tr><td colspan="6" class="text-center text-dim" style="padding:1.2rem">Nenhum registro ainda.</td></tr>` : ''}
          </tbody>
        </table>
      </div>
    </div>`;
}
async function aprovarCadastro(id){
  const c = state.cadastros.find(x=>x.id===id);
  let acessos = PROFILES.filter(p => document.getElementById(`aprova-${id}-${p.key}`)?.checked).map(p=>p.key);
  if(acessos.length === 0) acessos = [c.perfilSolicitado];
  cadastroActionError = '';
  const btn = document.getElementById(`btn-aprova-${id}`);
  if(btn){ btn.disabled = true; btn.textContent = 'Aprovando...'; }
  const { error } = await sb.from('profiles').update({ status:'aprovado', acessos }).eq('id', id);
  if(error){
    cadastroActionError = 'Não foi possível aprovar ' + c.nome + ': ' + error.message;
    render();
    return;
  }
  c.acessos = acessos;
  c.status = 'aprovado';
  render();
}
async function rejeitarCadastro(id){
  const c = state.cadastros.find(x=>x.id===id);
  cadastroActionError = '';
  const { error } = await sb.from('profiles').update({ status:'rejeitado', acessos:[] }).eq('id', id);
  if(error){
    cadastroActionError = 'Não foi possível recusar ' + c.nome + ': ' + error.message;
    render();
    return;
  }
  c.status = 'rejeitado';
  c.acessos = [];
  render();
}

/* ---- Modal: editar usuário (nome, acessos, status — SEM e-mail/senha de outra pessoa, isso exige Admin API server-side) ---- */
let euError = '';
function editarUsuarioFormHtml(c){
  const ehVoceMesmo = state.user && c.id === state.user.id;
  return `
    <div class="field"><label>Nome</label><input id="eu-nome" class="input" value="${esc(c.nome)}"></div>
    <div class="field">
      <label>E-mail</label>
      <input class="input" value="${esc(c.email)}" disabled style="opacity:.55">
      <p class="footnote mt-1">${ehVoceMesmo ? 'Pra trocar seu próprio e-mail, use as configurações de conta do Supabase.' : 'Trocar e-mail de outra pessoa exige a Admin API (chave de servidor) — não disponível aqui, por segurança.'}</p>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="eu-status" class="input">
        <option value="aprovado" ${c.status==='aprovado'?'selected':''}>Aprovado</option>
        <option value="pendente" ${c.status==='pendente'?'selected':''}>Pendente</option>
        <option value="rejeitado" ${c.status==='rejeitado'?'selected':''}>Recusado / Bloqueado</option>
      </select>
    </div>
    <div class="field">
      <label>Acessos (aplicado se status = Aprovado)</label>
      <div class="flex items-center gap-3 flex-wrap">
        ${PROFILES.map(p => `
          <label class="flex items-center gap-1-5 text-xs" style="color:var(--txt-dim)">
            <input type="checkbox" id="eu-acesso-${p.key}" ${(c.acessos||[]).includes(p.key)?'checked':''} style="width:14px;height:14px;accent-color:var(--verde)">
            ${esc(p.label)}
          </label>`).join('')}
      </div>
    </div>
    ${euError ? `<p class="text-erro text-xs mb-2">${esc(euError)}</p>` : ''}
    <button id="btn-salvar-usuario" class="btn btn-primary btn-block mt-2" onclick="salvarEdicaoUsuario('${c.id}')">Salvar alterações</button>
    <p class="footnote text-center mt-3">Redefinição de senha de outra pessoa não é possível pelo app (exige acesso de servidor). A própria pessoa pode usar "Esqueci minha senha" na tela de login.</p>`;
}
async function salvarEdicaoUsuario(id){
  const c = state.cadastros.find(x=>x.id===id);
  const nome = document.getElementById('eu-nome').value.trim();
  const status = document.getElementById('eu-status').value;
  const acessosMarcados = PROFILES.filter(p => document.getElementById(`eu-acesso-${p.key}`)?.checked).map(p=>p.key);
  if(!nome){ euError = 'Nome é obrigatório.'; render(); return; }
  if(status === 'aprovado' && acessosMarcados.length === 0){ euError = 'Marque ao menos um acesso pra deixar como aprovado.'; render(); return; }
  euError = '';
  const acessosFinal = status === 'aprovado' ? acessosMarcados : [];
  const btn = document.getElementById('btn-salvar-usuario');
  if(btn){ btn.disabled = true; btn.textContent = 'Salvando...'; }
  const { error } = await sb.from('profiles').update({ nome, status, acessos: acessosFinal }).eq('id', id);
  if(error){
    euError = 'Não foi possível salvar: ' + error.message;
    const body = document.querySelector('.modal-body');
    if(body) body.innerHTML = editarUsuarioFormHtml(c);
    return;
  }
  c.nome = nome;
  c.status = status;
  c.acessos = acessosFinal;
  euError = '';
  closeModal();
}

/* ============ MODAL HOST ============ */
function modalShell(title, bodyHtml, wide){
  return `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-box ${wide?'wide':''}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" onclick="closeModal()">${icon('x',18)}</button></div>
      <div class="modal-body">${bodyHtml}</div>
    </div>
  </div>`;
}
function renderModal(){
  if(!modal) return '';
  if(modal.type === 'novoMaterial') return modalShell('Novo material', materialFormHtml(null));
  if(modal.type === 'editarMaterial') return modalShell('Editar material', materialFormHtml(getMat(modal.materialId)));
  if(modal.type === 'novaMovimentacao') return modalShell('Registrar movimentação', novaMovimentacaoFormHtml());
  if(modal.type === 'editarUsuario') return modalShell('Editar usuário', editarUsuarioFormHtml(state.cadastros.find(c=>c.id===modal.cadastroId)));
  if(modal.type === 'autorizarBalancoOperador') return modalShell('Autorizar balanço', autorizarBalancoOperadorFormHtml());
  if(modal.type === 'verEtiqueta'){
    const mat = getMat(modal.materialId);
    return modalShell('Etiqueta — ' + mat.nome, `
      <div class="flex flex-col items-center">
        ${etiquetaCardHtml(mat)}
        <button onclick="window.print()" class="btn btn-primary mt-4" style="max-width:300px;width:100%">${icon('printer',16)} Imprimir</button>
        <p class="footnote text-center mt-3">Protótipo — layout ilustrativo, sem integração real com impressora térmica.</p>
      </div>`);
  }
  if(modal.type === 'verDetalhesMaterial'){
    const mat = getMat(modal.materialId);
    return modalShell(mat.nome, materialDetalhesModalHtml(mat));
  }
  if(modal.type === 'avisoBalancoPendente'){
    const s = state.balancoSolicitacoes.find(x => x.id === modal.solicitacaoId);
    return modalShell('Balanço pendente', `
      <div class="text-center">
        <div style="width:52px;height:52px;border-radius:999px;background:rgba(220,38,38,.15);color:var(--erro);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">${icon('alertTriangle',26)}</div>
        <p class="text-white text-sm mb-1">Você tem um balanço de estoque autorizado esperando.</p>
        <p class="text-dim text-xs mb-5">${s ? esc(escopoResumoTexto({tipo:s.escopoTipo,setor:s.setor,rua:s.rua,bloco:s.bloco})) : ''}${s && s.origem==='gestor' ? ' · solicitado pelo gestor' : ''}</p>
        <button class="btn btn-primary btn-block mb-2" onclick="closeModal();navTo('inventario')">Fazer agora</button>
        <button class="btn btn-ghost btn-block" onclick="closeModal()">Deixar pra depois</button>
      </div>`);
  }
  if(modal.type === 'scanner') return modalShell('Escanear código', scannerModalHtml(), true);
  return '';
}

/* ============ BOOTSTRAP ============ */
async function initApp(){
  state.carregando = true;
  render();
  try {
    const { data: { session } } = await sb.auth.getSession();
    if(session && session.user){
      const { data: perfil, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
      if(!error && perfil && perfil.status === 'aprovado' && perfil.acessos && perfil.acessos.length > 0){
        const acessos = perfil.acessos;
        if(acessos.length === 1){
          state.user = { id: session.user.id, nome: perfil.nome, perfil: acessos[0], acessos };
          state.screen = isOperadorPerfil(acessos[0]) ? 'operador' : 'gestor';
          await carregarDadosIniciais();
        } else {
          state.loginCandidate = { id: session.user.id, nome: perfil.nome, acessos };
        }
      } else {
        await sb.auth.signOut();
      }
    }
  } catch(e){
    console.error('erro ao verificar sessão existente:', e);
  }
  state.carregando = false;
  render();
}
initApp();

</script>
